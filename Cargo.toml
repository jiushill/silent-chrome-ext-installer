[package]
name = "silent-chrome-ext-installer"
version = "0.1.0"
edition = "2021"
description = "Phantom Chrome extension backdoor — bypass dev-mode gate via Secure Preferences"
license = "MIT"
repository = "https://github.com/jiushill/silent-chrome-ext-installer"

[dependencies]
serde_json = "=1.0.117"
sha2 = "=0.10.8"
hmac = "=0.12.1"
rsa = { version = "=0.9.6", features = ["pem"] }
base64 = "=0.21.7"
hex = "=0.4.3"
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "=1.0.86"
dirs = "=5.0.1"
zeroize = "=1.7.0"
pkcs1 = "=0.7.5"
pkcs8 = "=0.10.2"
signature = "=2.2.0"
spki = "=0.7.3"
rand = "=0.8.5"
base64ct = "=1.6.0"
winreg = "=0.50.0"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.48.0", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security", "Win32_System_Memory", "Win32_System_WindowsProgramming"] }